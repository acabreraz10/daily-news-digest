# Daily News Digest Configuration
# Customize your feeds, topics, and schedule here

settings:
  timezone: "US/Pacific"
  morning_digest_hour: 6
  midday_update_hour: 12
  evening_update_hour: 17
  max_articles_per_topic: 10
  max_articles_per_update: 5
  lookback_hours_digest: 24
  lookback_hours_update: 6

email:
  # These values are pulled from environment variables / GitHub secrets
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  use_tls: true
  # sender and recipient are set via env vars: EMAIL_SENDER, EMAIL_PASSWORD, EMAIL_RECIPIENT

topics:
  - name: "AI & Technology"
    icon: "\U0001F916"
    keywords:
      - artificial intelligence
      - machine learning
      - AI
      - LLM
      - GPT
      - deep learning
      - neural network
      - startup
      - tech
      - software
      - cloud
      - cybersecurity

  - name: "Finance & Markets"
    icon: "\U0001F4C8"
    keywords:
      - stock
      - market
      - economy
      - inflation
      - fed
      - interest rate
      - crypto
      - bitcoin
      - investment
      - earnings
      - GDP
      - trade
      - banking

  - name: "World News"
    icon: "\U0001F30D"
    keywords:
      - war
      - diplomacy
      - UN
      - NATO
      - geopolitics
      - climate
      - summit
      - treaty
      - election
      - government

  - name: "Colombia"
